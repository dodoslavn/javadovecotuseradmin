serverConfig.heading=Configurazione del server
serverConfig.pageIntro=Impostazioni di database, RabbitMQ e segnalazione errori per questa installazione, oltre all'ultimo rapporto dell'agente di sincronizzazione.
serverConfig.intro=Queste impostazioni si trovano in un file sull'host, non nel database:
serverConfig.fileMissing=file non trovato, vengono usati i valori predefiniti integrati
