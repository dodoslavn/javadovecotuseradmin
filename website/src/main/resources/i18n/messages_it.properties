serverConfig.passwordSet=(impostata)
serverConfig.passwordNotSet=(non impostata)
serverConfig.passwordBlankHint=lascia vuoto per mantenere la password attuale
serverConfig.mysqlReadOnlyHint=Sola lettura — l'app non può riscrivere in modo sicuro le proprie credenziali del database. Per cambiarle, modifica questo file direttamente sull'host e riavvia Tomcat:
serverConfig.save=Salva

serverConfig.sentry=Sentry (segnalazione errori)
serverConfig.sentry.dsn=DSN
serverConfig.sentry.hint=Lascia vuoto per disattivare la segnalazione errori. Le modifiche hanno effetto immediato, senza bisogno di riavvio.

serverConfig.sync=Stato di sincronizzazione
serverConfig.sync.hint=Segnalato dall'agente di sincronizzazione sul server di posta tramite RabbitMQ (la stessa connessione configurata sopra) dopo ogni esecuzione — non serve una credenziale separata.
serverConfig.sync.autoSync=Sincronizzazione automatica
serverConfig.sync.autoSync.hint=Se attiva, le modifiche agli account email (creazione, disattivazione, attivazione, eliminazione, cambio password) notificano automaticamente l'agente di sincronizzazione. Se disattiva, usa "Sincronizza ora" qui sotto dopo aver apportato modifiche.
serverConfig.sync.forceSync=Sincronizza ora
serverConfig.sync.forceSyncSuccess=Richiesta di sincronizzazione pubblicata — l'agente la riceverà a breve.
serverConfig.sync.forceSyncError=Impossibile pubblicare — controlla la connessione RabbitMQ sopra.
serverConfig.sync.lastSync=Ultima sincronizzazione completa riuscita
serverConfig.sync.lastRequestSent=Ultima richiesta di sincronizzazione inviata con successo
serverConfig.sync.never=Mai segnalato
serverConfig.sync.detail=Dettaglio
serverConfig.sync.status.ok=OK
serverConfig.sync.status.error=Errore

