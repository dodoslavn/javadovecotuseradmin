serverConfig.sync.forceSyncError=No se pudo publicar — comprueba la conexión RabbitMQ de arriba.
serverConfig.sync.lastSync=Última sincronización confirmada
serverConfig.sync.lastRequestSent=Última solicitud de sincronización enviada correctamente
serverConfig.sync.never=Nunca informado
serverConfig.sync.detail=Detalle
serverConfig.sync.status.ok=OK
serverConfig.sync.status.error=Error

