serverConfig.sync.autoSync.hint=Cuando está activada, los cambios en cuentas de correo (crear, desactivar, activar, eliminar, cambiar contraseña) notifican automáticamente al agente de sincronización. Cuando está desactivada, usa "Sincronizar ahora" más abajo tras hacer cambios.
serverConfig.sync.forceSync=Sincronizar ahora
