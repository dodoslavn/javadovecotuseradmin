setup.step2.heading=Úvodné nastavenie — vytvorenie databázy
setup.step2.intro=Spustite na serveri tieto príkazy (vyžaduje root/sudo) na vytvorenie databázy a účtu, ktorý aplikácia použije:
setup.step2.formIntro=Keď je to hotové, potvrďte alebo upravte nižšie uvedené údaje o pripojení a pokračujte. Sú vopred vyplnené podľa vyššie uvedených príkazov.
