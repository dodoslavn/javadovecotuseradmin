serverConfig.mysqlReadOnlyHint=Len na čítanie — aplikácia nemôže bezpečne prepísať vlastné prihlasovacie údaje k databáze. Ak ich chcete zmeniť, upravte tento súbor priamo na hostiteľovi a reštartujte Tomcat:
serverConfig.save=Uložiť

serverConfig.sentry=Sentry.io
