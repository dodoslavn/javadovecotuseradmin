serverConfig.sentry.hint=Ponechajte prázdne pre vypnutie hlásenia chýb. Zmeny sa prejavia okamžite, bez potreby reštartu.

serverConfig.sync=Stav synchronizácie
serverConfig.sync.hint=Hlási synchronizačný agent na poštovom serveri cez RabbitMQ (rovnaké pripojenie nakonfigurované vyššie) po každom behu — nie je potrebný samostatný prihlasovací údaj.
serverConfig.sync.autoSync=Automatická synchronizácia
serverConfig.sync.autoSync.hint=Ak je zapnutá, zmeny e-mailových účtov (vytvorenie, zakázanie, povolenie, vymazanie, zmena hesla) automaticky upozornia synchronizačného agenta. Ak je vypnutá, po vykonaní zmien použite nižšie "Synchronizovať teraz".
serverConfig.sync.forceSync=Synchronizovať teraz
serverConfig.sync.forceSyncSuccess=Žiadosť o synchronizáciu bola odoslaná — agent ju čoskoro spracuje.
serverConfig.sync.forceSyncError=Nepodarilo sa odoslať — skontrolujte pripojenie k RabbitMQ vyššie.
serverConfig.sync.lastSync=Posledná potvrdená synchronizácia
