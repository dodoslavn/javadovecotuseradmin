setup.step2.heading=Prvotní nastavení — vytvoření databáze
setup.step2.intro=Spusťte na serveru tyto příkazy (vyžaduje root/sudo) pro vytvoření databáze a účtu, který aplikace použije:
setup.step2.formIntro=Jakmile je to hotové, potvrďte nebo upravte níže uvedené údaje o připojení a pokračujte. Jsou předvyplněny podle výše uvedených příkazů.
