serverConfig.sync=Synchronisierungsstatus
serverConfig.sync.hint=Wird vom Sync-Agenten auf dem Mailserver über RabbitMQ (dieselbe oben konfigurierte Verbindung) nach jedem Lauf gemeldet — keine separaten Zugangsdaten erforderlich.
