serverConfig.heading=Konfiguracja serwera
serverConfig.pageIntro=Ustawienia bazy danych, RabbitMQ i zgłaszania błędów dla tej instalacji oraz ostatni raport agenta synchronizacji.
serverConfig.intro=Te ustawienia znajdują się w pliku na hoście, a nie w bazie danych:
serverConfig.fileMissing=nie znaleziono pliku, używane są wbudowane wartości domyślne
serverConfig.mysql=MariaDB
serverConfig.rabbitmq=RabbitMQ
serverConfig.rabbitmq.connection=Połączenie
serverConfig.rabbitmq.connected=Połączono
serverConfig.rabbitmq.disconnected=Rozłączono
serverConfig.dbUrl=URL JDBC
serverConfig.dbUser=Nazwa użytkownika
serverConfig.password=Hasło
serverConfig.passwordSet=(ustawione)
serverConfig.passwordNotSet=(nieustawione)
serverConfig.passwordBlankHint=pozostaw puste, aby zachować obecne hasło
serverConfig.mysqlReadOnlyHint=Tylko do odczytu — aplikacja nie może bezpiecznie nadpisać własnych danych uwierzytelniających do bazy danych. Aby je zmienić, edytuj ten plik bezpośrednio na hoście i uruchom ponownie Tomcat:
serverConfig.save=Zapisz

serverConfig.sentry=Sentry.io
serverConfig.sentry.dsn=DSN
serverConfig.sentry.hint=Pozostaw puste, aby wyłączyć zgłaszanie błędów. Zmiany obowiązują natychmiast, bez konieczności ponownego uruchomienia.

serverConfig.sync=Stan synchronizacji
serverConfig.sync.hint=Zgłaszane przez agenta synchronizacji na serwerze pocztowym przez RabbitMQ (to samo połączenie skonfigurowane powyżej) po każdym uruchomieniu — nie jest potrzebne osobne poświadczenie.
serverConfig.sync.autoSync=Automatyczna synchronizacja
serverConfig.sync.autoSync.hint=Gdy włączone, zmiany kont pocztowych (tworzenie, wyłączanie, włączanie, usuwanie, zmiana hasła) automatycznie powiadamiają agenta synchronizacji. Gdy wyłączone, użyj poniżej "Synchronizuj teraz" po wprowadzeniu zmian.
serverConfig.sync.forceSync=Synchronizuj teraz
serverConfig.sync.forceSyncSuccess=Żądanie synchronizacji zostało opublikowane — agent wkrótce je odbierze.
serverConfig.sync.forceSyncError=Nie udało się opublikować — sprawdź połączenie RabbitMQ powyżej.
serverConfig.sync.lastSync=Ostatnia potwierdzona synchronizacja
serverConfig.sync.lastRequestSent=Ostatnio pomyślnie wysłane żądanie synchronizacji
serverConfig.sync.never=Nigdy nie zgłoszono
serverConfig.sync.detail=Szczegóły
serverConfig.sync.status.ok=OK
serverConfig.sync.status.error=Błąd

rabbitmq.host=Host
rabbitmq.port=Port
rabbitmq.vhost=Host wirtualny
rabbitmq.username=Nazwa użytkownika
rabbitmq.password=Hasło
rabbitmq.exchange=Nazwa exchange
rabbitmq.exchange.hint=Topic exchange, do którego ta aplikacja publikuje żądania synchronizacji — agent synchronizacji z niego odbiera.
rabbitmq.routingKey=Klucz routingu
rabbitmq.routingKey.hint=Klucz routingu, z którym ta aplikacja publikuje żądania synchronizacji do powyższego exchange. Pozostaw puste, aby użyć domyślnej wartości account.changed.
rabbitmq.queue=Nazwa kolejki
rabbitmq.queue.hint=Kolejka, na której ta aplikacja odbiera raporty o stanie synchronizacji od agenta. Pozostaw puste, aby użyć domyślnej wartości mailadmin.sync-status.

setup.step1.heading=Konfiguracja wstępna — wybierz bazę danych
setup.step1.intro=Żadna baza danych nie jest jeszcze skonfigurowana. Wybierz system bazy danych i nazwę bazy danych, której użyje ta aplikacja.
setup.step1.dbSystem=System bazy danych
setup.step1.dbName=Nazwa bazy danych
setup.step1.continue=Dalej

setup.step2.heading=Konfiguracja wstępna — utwórz bazę danych
setup.step2.intro=Uruchom te polecenia na serwerze (wymaga root/sudo), aby utworzyć bazę danych i konto, którego użyje aplikacja:
setup.step2.formIntro=Gdy to zrobisz, potwierdź lub dostosuj poniższe dane połączenia i kontynuuj. Są one wstępnie wypełnione zgodnie z powyższymi poleceniami.
setup.step2.host=Host
setup.step2.port=Port
setup.step2.username=Nazwa użytkownika
setup.step2.password=Hasło
setup.step2.continue=Testuj połączenie i kontynuuj

setup.step3.heading=Konfiguracja wstępna — utwórz pierwszego administratora
setup.step3.intro=Połączono pomyślnie, baza danych jest gotowa. Żadne konta jeszcze nie istnieją — utwórz pierwszy dostęp administratora:
setup.step3.username=Nazwa użytkownika administratora
setup.step3.password=Hasło administratora
setup.step3.finish=Utwórz administratora i zakończ

error.heading=Coś poszło nie tak
