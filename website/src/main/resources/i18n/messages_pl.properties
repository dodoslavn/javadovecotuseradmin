auditLog.heading=Dziennik zdarzeń (ostatnie 200)
auditLog.intro=Historia tylko do odczytu każdej zmiany w tej aplikacji — kto, co, kiedy zrobił i na którym koncie. Tajne wartości, takie jak hasła i hasze, nigdy nie są zapisywane — tylko fakt, że się zmieniły.
