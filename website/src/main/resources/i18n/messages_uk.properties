myAccounts.error.hashFailed=Не вдалося хешувати пароль через doveadm

serverConfig.heading=Налаштування сервера
serverConfig.pageIntro=Налаштування бази даних, RabbitMQ та звітування про помилки для цієї інсталяції, а також останній звіт агента синхронізації.
serverConfig.intro=Ці налаштування зберігаються у файлі на хості, а не в базі даних:
serverConfig.fileMissing=файл не знайдено, використовуються вбудовані значення за замовчуванням
serverConfig.mysql=MariaDB
serverConfig.rabbitmq=RabbitMQ
serverConfig.rabbitmq.connection=З'єднання
serverConfig.rabbitmq.connected=Підключено
serverConfig.rabbitmq.disconnected=Не підключено
serverConfig.dbUrl=JDBC URL
serverConfig.dbUser=Ім'я користувача
serverConfig.password=Пароль
serverConfig.passwordSet=(встановлено)
serverConfig.passwordNotSet=(не встановлено)
serverConfig.passwordBlankHint=залиште порожнім, щоб зберегти поточний пароль
serverConfig.mysqlReadOnlyHint=Лише для читання — застосунок не може безпечно перезаписати власні облікові дані бази даних. Щоб їх змінити, відредагуйте цей файл безпосередньо на хості та перезапустіть Tomcat:
serverConfig.save=Зберегти

serverConfig.sentry=Sentry.io
serverConfig.sentry.dsn=DSN
serverConfig.sentry.hint=Залиште порожнім, щоб вимкнути звітування про помилки. Зміни набувають чинності негайно, перезапуск не потрібен.

serverConfig.sync=Статус синхронізації
serverConfig.sync.hint=Звітується агентом синхронізації на поштовому сервері через RabbitMQ (те саме з'єднання, що налаштоване вище) після кожного запуску — окремі облікові дані не потрібні.
serverConfig.sync.autoSync=Автосинхронізація
serverConfig.sync.autoSync.hint=Коли ввімкнено, зміни поштових облікових записів (створення, вимкнення, увімкнення, видалення, зміна пароля) автоматично повідомляють агента синхронізації. Коли вимкнено, використовуйте "Синхронізувати зараз" нижче після внесення змін.
serverConfig.sync.forceSync=Синхронізувати зараз
serverConfig.sync.forceSyncSuccess=Запит на синхронізацію опубліковано — агент незабаром його отримає.
serverConfig.sync.forceSyncError=Не вдалося опублікувати — перевірте з'єднання RabbitMQ вище.
serverConfig.sync.lastSync=Остання підтверджена синхронізація
serverConfig.sync.lastRequestSent=Останній успішно надісланий запит на синхронізацію
serverConfig.sync.never=Ще не повідомлялося
serverConfig.sync.detail=Деталі
serverConfig.sync.status.ok=ОК
serverConfig.sync.status.error=Помилка

rabbitmq.host=Хост
rabbitmq.port=Порт
rabbitmq.vhost=Віртуальний хост
rabbitmq.username=Ім'я користувача
rabbitmq.password=Пароль
rabbitmq.exchange=Назва exchange
rabbitmq.exchange.hint=Topic exchange, до якого цей застосунок публікує запити на синхронізацію — агент синхронізації споживає з нього.
rabbitmq.routingKey=Ключ маршрутизації
rabbitmq.routingKey.hint=Ключ маршрутизації, з яким цей застосунок публікує запити на синхронізацію до вказаного вище exchange. Залиште порожнім для значення за замовчуванням account.changed.
rabbitmq.queue=Назва черги
rabbitmq.queue.hint=Черга, на якій цей застосунок отримує звіти про стан синхронізації від агента. Залиште порожнім для значення за замовчуванням mailadmin.sync-status.

setup.step1.heading=Початкове налаштування — виберіть базу даних
setup.step1.intro=Базу даних ще не налаштовано. Виберіть систему бази даних і назву бази даних, яку використовуватиме цей застосунок.
