auditLog.heading=Журнал аудиту (останні 200)
auditLog.intro=Історія лише для читання кожної зміни в цьому застосунку — хто, що, коли зробив і з яким обліковим записом. Таємні значення, як-от паролі та хеші, ніколи не записуються — лише факт, що вони змінилися.
