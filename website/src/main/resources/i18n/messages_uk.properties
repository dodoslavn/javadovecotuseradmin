mailAccounts.action.back=← Назад до всіх листів
mailAccounts.create.legend=Створити поштовий обліковий запис
mailAccounts.create.intro=Створює справжню поштову скриньку Dovecot на цьому сервері. Пароль одразу хешується через doveadm — він ніколи не зберігається та не записується у відкритому вигляді.
