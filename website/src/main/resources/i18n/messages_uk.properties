myAccounts.heading=Панель
myAccounts.intro=Поштові скриньки, якими керує ваш обліковий запис, з можливістю змінити їхній пароль або вимкнути їх.
myAccounts.empty=До вашого облікового запису ще не прив'язано жодного поштового облікового запису — попросіть адміністратора прив'язати один.
