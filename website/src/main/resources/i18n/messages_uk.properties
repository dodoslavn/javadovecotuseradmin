setup.step1.dbName=Назва бази даних
setup.step1.continue=Продовжити

setup.step2.heading=Початкове налаштування — створення бази даних
setup.step2.intro=Виконайте ці команди на сервері (потрібні права root/sudo), щоб створити базу даних та обліковий запис для застосунку:
setup.step2.formIntro=Коли це буде зроблено, підтвердьте або налаштуйте дані підключення нижче та продовжте. Вони попередньо заповнені відповідно до наведених вище команд.
setup.step2.host=Хост
setup.step2.port=Порт
setup.step2.username=Ім'я користувача
setup.step2.password=Пароль
setup.step2.continue=Перевірити з'єднання та продовжити

setup.step3.heading=Початкове налаштування — створення першого адміністратора
setup.step3.intro=Успішно підключено, база даних готова. Облікових записів ще не існує — створіть перший адміністративний доступ:
setup.step3.username=Ім'я користувача адміністратора
setup.step3.password=Пароль адміністратора
setup.step3.finish=Створити адміністратора та завершити

